<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <div class="reactor-outer" id="reactor">
            <div class="reactor-inner"></div>
        </div>
        
        <h1 id="title">J.A.R.V.I.S.</h1>
        <p id="status">Status: Aguardando inicialização...</p>
        
        <div class="output-box" id="output">
            "Olá, senhor. Clique no reator para ativar o reconhecimento de voz."
        </div>

        <button id="activateBtn" class="btn">Ativar Comando de Voz</button>
    </main>

    <script src="script.js"></script>
</body>
</html>
