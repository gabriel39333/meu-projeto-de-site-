<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Assistente Pessoal Web</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <header class="border-b border-slate-800 p-4 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-robot text-brand-500 text-2xl"></i>
                <h1 class="font-bold text-lg">Nexus AI - Assistente</h1>
            </div>
            <button id="btn-theme" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col">
        <!-- Area de Chat -->
        <div id="chat-box" class="flex-1 bg-slate-800/50 rounded-2xl p-4 overflow-y-auto space-y-4 border border-slate-700/50 min-h-[400px]">
            <!-- Mensagens são adicionadas dinamicamente via JS -->
        </div>

        <!-- Form de Envio -->
        <form id="chat-form" class="mt-4 flex gap-2">
            <input type="text" id="user-input" placeholder="Digite seu comando..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button type="button" id="btn-mic" class="px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl hover:bg-slate-700 text-blue-400">
                <i class="fa-solid fa-microphone"></i>
            </button>
            <button type="submit" class="px-6 py-3 bg-blue-600 hover:bg-blue-500 font-medium rounded-xl">Enviar</button>
        </form>
    </main>

    <!-- Scripts Modulares -->
    <script src="assets/js/commands.js"></script>
    <script src="assets/js/assistant.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
